name: Temporary media metadata styling patch v4

on:
  push:
    branches:
      - feat/media-metadata-styling

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Apply feature patch and corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/tmp-media-metadata-styling-v3.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          block = workflow.split(marker, 1)[1].split("\n          PY", 1)[0]
          exec(compile(textwrap.dedent(block), '<media-metadata-v3-patch>', 'exec'))

          setup = Path('intg-appletv/setup_flow.py')
          text = setup.read_text(encoding='utf-8')
          old = 'async def _handle_configuration_mode(msg: UserDataResponse) -> RequestUserInput | SetupComplete | SetupError:\n'
          new = 'async def _handle_configuration_mode(  # noqa: PLR0915\n    msg: UserDataResponse,\n) -> RequestUserInput | SetupComplete | SetupError:\n'
          if text.count(old) != 1:
              raise SystemExit('Could not locate configuration-mode function')
          setup.write_text(text.replace(old, new, 1), encoding='utf-8')

          tv = Path('intg-appletv/tv.py')
          text = tv.read_text(encoding='utf-8')
          start = text.index('    @property\ndef media_title(self) -> str:\n')
          end = text.index('    @property\n    def attributes(self) -> dict[str, Any]:\n', start)
          properties = '''    @property
              def media_title(self) -> str:
                  """Return the media title formatted for Remote UI when styling is enabled."""
                  return apply_media_text_style(
                      self._media_title,
                      enabled=self._device.media_styling,
                      template=self._device.media_title_style,
                      fallback_template=DEFAULT_MEDIA_TITLE_STYLE,
                  )

              @property
              def media_artist(self) -> str:
                  """Return the media artist formatted for Remote UI when styling is enabled."""
                  return apply_media_text_style(
                      self._media_artist,
                      enabled=self._device.media_styling,
                      template=self._device.media_artist_style,
                      fallback_template=DEFAULT_MEDIA_ARTIST_STYLE,
                  )

          '''
          properties = textwrap.dedent(properties)
          properties = ''.join(('    ' + line if line.strip() else line) for line in properties.splitlines(keepends=True))
          tv.write_text(text[:start] + properties + text[end:], encoding='utf-8')
          PY
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r test-requirements.txt
      - name: Validate exactly like repository CI
        run: |
          python -m ruff check intg-appletv --fix
          python -m ruff format intg-appletv tests/unit/test_media_styling.py
          python -m ruff check intg-appletv
          python -m ruff format --check intg-appletv
          python -m pyright
          python -m pytest
      - name: Commit feature
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add intg-appletv/config.py intg-appletv/setup_flow.py intg-appletv/tv.py intg-appletv/media_styling.py tests/unit/test_media_styling.py
          git commit -m 'Add optional media metadata styling'
          git push origin HEAD:feat/media-metadata-styling
