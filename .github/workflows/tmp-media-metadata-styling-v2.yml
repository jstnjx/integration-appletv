name: Temporary media metadata styling patch v2

on:
  push:
    branches:
      - feat/media-metadata-styling

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Apply feature patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one patch target in {path}, found {count}: {old[:120]!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          Path("intg-appletv/media_styling.py").write_text(
              '''"""Remote UI rich-text styling helpers for media metadata."""

          from html import escape

          DEFAULT_MEDIA_TITLE_STYLE = "<b>{text}</b>"
          DEFAULT_MEDIA_ARTIST_STYLE = '<i><font color="#9ca3af">{text}</font></i>'
          TEXT_PLACEHOLDER = "{text}"


          def normalize_media_style_template(template: str | None, fallback: str) -> str:
              """Return a usable rich-text template containing the metadata placeholder."""
              normalized = (template or "").strip()
              return normalized if TEXT_PLACEHOLDER in normalized else fallback


          def apply_media_text_style(
              text: str | None,
              *,
              enabled: bool,
              template: str | None,
              fallback_template: str,
          ) -> str:
              """Apply an opt-in Qt rich-text template to a media metadata value."""
              if not text:
                  return ""
              if not enabled:
                  return text

              chosen = normalize_media_style_template(template, fallback_template)
              # Apple TV metadata is untrusted input. Escape it before inserting it into
              # the setup-defined rich-text template so metadata cannot inject markup.
              safe_text = escape(text, quote=False)
              return chosen.replace(TEXT_PLACEHOLDER, safe_text)
          ''',
              encoding="utf-8",
          )

          replace_once(
              "intg-appletv/config.py",
              "import discover\n",
              '''import discover
          from media_styling import (
              DEFAULT_MEDIA_ARTIST_STYLE,
              DEFAULT_MEDIA_TITLE_STYLE,
              normalize_media_style_template,
          )
          ''',
          )
          replace_once(
              "intg-appletv/config.py",
              '''    global_volume: bool | None = True
              """Change volume on all connected devices."""
          ''',
              '''    global_volume: bool | None = True
              """Change volume on all connected devices."""
              media_styling: bool = False
              """Enable Remote UI rich-text styling for media title and artist."""
              media_title_style: str = DEFAULT_MEDIA_TITLE_STYLE
              """Qt rich-text template for media title. Must contain ``{text}``."""
              media_artist_style: str = DEFAULT_MEDIA_ARTIST_STYLE
              """Qt rich-text template for media artist. Must contain ``{text}``."""
          ''',
          )
          replace_once(
              "intg-appletv/config.py",
              "                atv.global_volume = atv.global_volume if atv.global_volume is not None else True\n",
              '''                atv.global_volume = atv.global_volume if atv.global_volume is not None else True
                  atv.media_styling = bool(atv.media_styling)
                  atv.media_title_style = normalize_media_style_template(
                      atv.media_title_style, DEFAULT_MEDIA_TITLE_STYLE
                  )
                  atv.media_artist_style = normalize_media_style_template(
                      atv.media_artist_style, DEFAULT_MEDIA_ARTIST_STYLE
                  )
          ''',
          )
          replace_once(
              "intg-appletv/config.py",
              '                    item.get("global_volume", True),\n',
              '''                    item.get("global_volume", True),
                      bool(item.get("media_styling", False)),
                      normalize_media_style_template(item.get("media_title_style"), DEFAULT_MEDIA_TITLE_STYLE),
                      normalize_media_style_template(item.get("media_artist_style"), DEFAULT_MEDIA_ARTIST_STYLE),
          ''',
          )

          replace_once(
              "intg-appletv/setup_flow.py",
              "from i18n import __, _a, _af, _am\nimport tv\n",
              '''from i18n import __, _a, _af, _am
          from media_styling import (
              DEFAULT_MEDIA_ARTIST_STYLE,
              DEFAULT_MEDIA_TITLE_STYLE,
              normalize_media_style_template,
          )
          import tv
          ''',
          )
          replace_once(
              "intg-appletv/setup_flow.py",
              "            global_volume = selected_device.global_volume if selected_device.global_volume is not None else True\n\n",
              '''            global_volume = selected_device.global_volume if selected_device.global_volume is not None else True
              media_styling = selected_device.media_styling
              media_title_style = normalize_media_style_template(
                  selected_device.media_title_style, DEFAULT_MEDIA_TITLE_STYLE
              )
              media_artist_style = normalize_media_style_template(
                  selected_device.media_artist_style, DEFAULT_MEDIA_ARTIST_STYLE
              )

          ''',
          )
          replace_once(
              "intg-appletv/setup_flow.py",
              '''                    __global_volume(enabled=global_volume),
                  ],
              )
          ''',
              '''                    __global_volume(enabled=global_volume),
                      *__media_styling(
                          enabled=media_styling,
                          title_style=media_title_style,
                          artist_style=media_artist_style,
                      ),
                  ],
              )
          ''',
          )
          replace_once(
              "intg-appletv/setup_flow.py",
              '''            __global_volume(enabled=True),
              ],
          )


          async def _handle_device_choice''',
              '''            __global_volume(enabled=True),
                  *__media_styling(
                      enabled=False,
                      title_style=DEFAULT_MEDIA_TITLE_STYLE,
                      artist_style=DEFAULT_MEDIA_ARTIST_STYLE,
                  ),
              ],
          )


          async def _handle_device_choice''',
          )
          replace_once(
              "intg-appletv/setup_flow.py",
              '''    choice = msg.input_values["choice"]
              global_volume = msg.input_values.get("global_volume", "true") == "true"

          ''',
              '''    choice = msg.input_values["choice"]
              global_volume = _checkbox_enabled(msg.input_values.get("global_volume"), default=True)
              media_styling = _checkbox_enabled(msg.input_values.get("media_styling"), default=False)
              media_title_style = normalize_media_style_template(
                  msg.input_values.get("media_title_style"), DEFAULT_MEDIA_TITLE_STYLE
              )
              media_artist_style = normalize_media_style_template(
                  msg.input_values.get("media_artist_style"), DEFAULT_MEDIA_ARTIST_STYLE
              )

          ''',
          )
          replace_once(
              "intg-appletv/setup_flow.py",
              '''            global_volume=global_volume,
              ),
              loop=asyncio.get_event_loop(),
          ''',
              '''            global_volume=global_volume,
                  media_styling=media_styling,
                  media_title_style=media_title_style,
                  media_artist_style=media_artist_style,
              ),
              loop=asyncio.get_event_loop(),
          ''',
          )
          replace_once(
              "intg-appletv/setup_flow.py",
              "        global_volume=_pairing_apple_tv.device_config.global_volume,\n",
              '''        global_volume=_pairing_apple_tv.device_config.global_volume,
                  media_styling=_pairing_apple_tv.device_config.media_styling,
                  media_title_style=_pairing_apple_tv.device_config.media_title_style,
                  media_artist_style=_pairing_apple_tv.device_config.media_artist_style,
          ''',
          )
          replace_once(
              "intg-appletv/setup_flow.py",
              '    global_volume = msg.input_values.get("global_volume", "true") == "true"\n\n',
              '''    global_volume = _checkbox_enabled(msg.input_values.get("global_volume"), default=True)
              media_styling = _checkbox_enabled(msg.input_values.get("media_styling"), default=False)
              media_title_style = normalize_media_style_template(
                  msg.input_values.get("media_title_style"), DEFAULT_MEDIA_TITLE_STYLE
              )
              media_artist_style = normalize_media_style_template(
                  msg.input_values.get("media_artist_style"), DEFAULT_MEDIA_ARTIST_STYLE
              )

          ''',
          )
          replace_once(
              "intg-appletv/setup_flow.py",
              "    _reconfigured_device.global_volume = global_volume\n\n",
              '''    _reconfigured_device.global_volume = global_volume
              _reconfigured_device.media_styling = media_styling
              _reconfigured_device.media_title_style = media_title_style
              _reconfigured_device.media_artist_style = media_artist_style

          ''',
          )
          replace_once(
              "intg-appletv/setup_flow.py",
              '''def __global_volume(*, enabled: bool) -> dict[str, Any]:
              return {
                  "id": "global_volume",
                  "label": _a("Change volume on all connected devices"),
                  "field": {"checkbox": {"value": enabled}},
              }
          ''',
              '''def _checkbox_enabled(value: Any, *, default: bool) -> bool:
              """Convert setup checkbox values from bool or string representation."""
              if value is None:
                  return default
              if isinstance(value, bool):
                  return value
              return str(value).casefold() == "true"


          def __global_volume(*, enabled: bool) -> dict[str, Any]:
              return {
                  "id": "global_volume",
                  "label": _a("Change volume on all connected devices"),
                  "field": {"checkbox": {"value": enabled}},
              }


          def __media_styling(*, enabled: bool, title_style: str, artist_style: str) -> list[dict[str, Any]]:
              """Build optional Remote UI rich-text metadata styling setup fields."""
              return [
                  {
                      "id": "media_styling",
                      "label": _a("Style media title and artist"),
                      "field": {"checkbox": {"value": enabled}},
                  },
                  {
                      "id": "media_styling_info",
                      "label": _a("Media text styling"),
                      "field": {
                          "label": {
                              "value": _a(
                                  "Optional Remote UI rich text. Use {text} for the title or artist. "
                                  "Supported examples include <b>, <i>, <u>, <strong> and quoted "
                                  "<font color=\"#RRGGBB\"> tags."
                              )
                          }
                      },
                  },
                  {
                      "id": "media_title_style",
                      "label": _a("Media title style"),
                      "field": {"text": {"value": title_style}},
                  },
                  {
                      "id": "media_artist_style",
                      "label": _a("Media artist style"),
                      "field": {"text": {"value": artist_style}},
                  },
              ]
          ''',
          )

          replace_once(
              "intg-appletv/tv.py",
              "from config import AtvDevice, AtvProtocol\nfrom utils import replace_bad_chars\n",
              '''from config import AtvDevice, AtvProtocol
          from media_styling import (
              DEFAULT_MEDIA_ARTIST_STYLE,
              DEFAULT_MEDIA_TITLE_STYLE,
              apply_media_text_style,
          )
          from utils import replace_bad_chars
          ''',
          )
          replace_once(
              "intg-appletv/tv.py",
              '''    @property
              def attributes(self) -> dict[str, Any]:
          ''',
              '''    @property
              def media_title(self) -> str:
                  """Return the media title formatted for Remote UI when styling is enabled."""
                  return apply_media_text_style(
                      self._media_title,
                      enabled=self._device.media_styling,
                      template=self._device.media_title_style,
                      fallback_template=DEFAULT_MEDIA_TITLE_STYLE,
                  )

              @property
              def media_artist(self) -> str:
                  """Return the media artist formatted for Remote UI when styling is enabled."""
                  return apply_media_text_style(
                      self._media_artist,
                      enabled=self._device.media_styling,
                      template=self._device.media_artist_style,
                      fallback_template=DEFAULT_MEDIA_ARTIST_STYLE,
                  )

              @property
              def attributes(self) -> dict[str, Any]:
          ''',
          )
          replace_once(
              "intg-appletv/tv.py",
              '''            MediaAttr.MEDIA_TITLE: self._media_title or "",
                  MediaAttr.MEDIA_ALBUM: self._media_album or "",
                  MediaAttr.MEDIA_ARTIST: self._media_artist or "",
          ''',
              '''            MediaAttr.MEDIA_TITLE: self.media_title,
                  MediaAttr.MEDIA_ALBUM: self._media_album or "",
                  MediaAttr.MEDIA_ARTIST: self.media_artist,
          ''',
          )
          replace_once(
              "intg-appletv/tv.py",
              '''        if not device.credentials:
                  device.credentials = []
              self._device = device
              self._apple_tv_conf = None
          ''',
              '''        if not device.credentials:
                  device.credentials = []
              previous_title = self.media_title
              previous_artist = self.media_artist
              self._device = device
              self._apple_tv_conf = None

              metadata_update: dict[MediaAttr, Any] = {}
              if self.media_title != previous_title:
                  metadata_update[MediaAttr.MEDIA_TITLE] = self.media_title
              if self.media_artist != previous_artist:
                  metadata_update[MediaAttr.MEDIA_ARTIST] = self.media_artist
              if metadata_update:
                  self.events.emit(EVENTS.UPDATE, self._device.identifier, metadata_update)
          ''',
          )
          replace_once(
              "intg-appletv/tv.py",
              '''        if raw_title != self._media_title:
                  self._media_title = raw_title
                  update[MediaAttr.MEDIA_TITLE] = raw_title

              raw_artist = data.artist or ""
              if raw_artist != self._media_artist:
                  self._media_artist = raw_artist
                  update[MediaAttr.MEDIA_ARTIST] = raw_artist
          ''',
              '''        if raw_title != self._media_title:
                  self._media_title = raw_title
                  update[MediaAttr.MEDIA_TITLE] = self.media_title

              raw_artist = data.artist or ""
              if raw_artist != self._media_artist:
                  self._media_artist = raw_artist
                  update[MediaAttr.MEDIA_ARTIST] = self.media_artist
          ''',
          )

          Path("tests/unit/test_media_styling.py").write_text(
              '''"""Tests for optional Remote UI rich-text media metadata styling."""

          from media_styling import (
              DEFAULT_MEDIA_ARTIST_STYLE,
              DEFAULT_MEDIA_TITLE_STYLE,
              apply_media_text_style,
              normalize_media_style_template,
          )


          def test_styling_disabled_preserves_original_text() -> None:
              assert apply_media_text_style(
                  "AC/DC & Friends",
                  enabled=False,
                  template="<b>{text}</b>",
                  fallback_template=DEFAULT_MEDIA_TITLE_STYLE,
              ) == "AC/DC & Friends"


          def test_styling_applies_user_template() -> None:
              assert apply_media_text_style(
                  "Now Playing",
                  enabled=True,
                  template='<u><font color="#865cff">{text}</font></u>',
                  fallback_template=DEFAULT_MEDIA_TITLE_STYLE,
              ) == '<u><font color="#865cff">Now Playing</font></u>'


          def test_metadata_is_escaped_before_inserting_into_rich_text() -> None:
              assert apply_media_text_style(
                  "A & <img src=bad>",
                  enabled=True,
                  template="<b>{text}</b>",
                  fallback_template=DEFAULT_MEDIA_TITLE_STYLE,
              ) == "<b>A &amp; &lt;img src=bad&gt;</b>"


          def test_invalid_template_falls_back_to_default() -> None:
              assert normalize_media_style_template(
                  "<b>constant</b>", DEFAULT_MEDIA_TITLE_STYLE
              ) == DEFAULT_MEDIA_TITLE_STYLE
              assert apply_media_text_style(
                  "Song",
                  enabled=True,
                  template="<b>constant</b>",
                  fallback_template=DEFAULT_MEDIA_TITLE_STYLE,
              ) == "<b>Song</b>"


          def test_default_artist_style() -> None:
              assert apply_media_text_style(
                  "Artist",
                  enabled=True,
                  template=DEFAULT_MEDIA_ARTIST_STYLE,
                  fallback_template=DEFAULT_MEDIA_ARTIST_STYLE,
              ) == '<i><font color="#9ca3af">Artist</font></i>'
          ''',
              encoding="utf-8",
          )
          PY
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r test-requirements.txt
      - name: Format and validate
        run: |
          python -m ruff check intg-appletv tests --fix
          python -m ruff format intg-appletv tests
          python -m ruff check intg-appletv tests
          python -m ruff format --check intg-appletv tests
          python -m pyright
          python -m pytest
      - name: Commit feature
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add intg-appletv/config.py intg-appletv/setup_flow.py intg-appletv/tv.py intg-appletv/media_styling.py tests/unit/test_media_styling.py
          git commit -m 'Add optional media metadata styling'
          git push origin HEAD:feat/media-metadata-styling
