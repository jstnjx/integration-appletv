name: Temporary media metadata styling patch v3

on:
  push:
    branches:
      - feat/media-metadata-styling

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Apply feature patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, name: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{name}: expected one match, found {count}: {old!r}")
              return text.replace(old, new, 1)

          # Shared styling helper.
          Path("intg-appletv/media_styling.py").write_text(
              '''"""Remote UI rich-text styling helpers for media metadata."""

          from html import escape

          DEFAULT_MEDIA_TITLE_STYLE = "<b>{text}</b>"
          DEFAULT_MEDIA_ARTIST_STYLE = '<i><font color="#9ca3af">{text}</font></i>'
          TEXT_PLACEHOLDER = "{text}"


          def normalize_media_style_template(template: str | None, fallback: str) -> str:
              """Return a usable rich-text template containing the metadata placeholder."""
              normalized = (template or "").strip()
              return normalized if TEXT_PLACEHOLDER in normalized else fallback


          def apply_media_text_style(
              text: str | None,
              *,
              enabled: bool,
              template: str | None,
              fallback_template: str,
          ) -> str:
              """Apply an opt-in Qt rich-text template to a media metadata value."""
              if not text:
                  return ""
              if not enabled:
                  return text
              chosen = normalize_media_style_template(template, fallback_template)
              safe_text = escape(text, quote=False)
              return chosen.replace(TEXT_PLACEHOLDER, safe_text)
          ''',
              encoding="utf-8",
          )

          # Persist styling choices, with backwards-compatible defaults.
          path = Path("intg-appletv/config.py")
          text = path.read_text(encoding="utf-8")
          text = replace_once(
              text,
              "import discover\n",
              "import discover\nfrom media_styling import (\n    DEFAULT_MEDIA_ARTIST_STYLE,\n    DEFAULT_MEDIA_TITLE_STYLE,\n    normalize_media_style_template,\n)\n",
              "config import",
          )
          anchor = '    """Change volume on all connected devices."""\n'
          text = replace_once(
              text,
              anchor,
              anchor
              + '    media_styling: bool = False\n'
              + '    """Enable Remote UI rich-text styling for media title and artist."""\n'
              + '    media_title_style: str = DEFAULT_MEDIA_TITLE_STYLE\n'
              + '    """Qt rich-text template for media title. Must contain ``{text}``."""\n'
              + '    media_artist_style: str = DEFAULT_MEDIA_ARTIST_STYLE\n'
              + '    """Qt rich-text template for media artist. Must contain ``{text}``."""\n',
              "config fields",
          )
          anchor = "                atv.global_volume = atv.global_volume if atv.global_volume is not None else True\n"
          text = replace_once(
              text,
              anchor,
              anchor
              + "                atv.media_styling = bool(atv.media_styling)\n"
              + "                atv.media_title_style = normalize_media_style_template(\n"
              + "                    atv.media_title_style, DEFAULT_MEDIA_TITLE_STYLE\n"
              + "                )\n"
              + "                atv.media_artist_style = normalize_media_style_template(\n"
              + "                    atv.media_artist_style, DEFAULT_MEDIA_ARTIST_STYLE\n"
              + "                )\n",
              "config update normalization",
          )
          anchor = '                    item.get("global_volume", True),\n'
          text = replace_once(
              text,
              anchor,
              anchor
              + '                    bool(item.get("media_styling", False)),\n'
              + '                    normalize_media_style_template(item.get("media_title_style"), DEFAULT_MEDIA_TITLE_STYLE),\n'
              + '                    normalize_media_style_template(item.get("media_artist_style"), DEFAULT_MEDIA_ARTIST_STYLE),\n',
              "config load",
          )
          path.write_text(text, encoding="utf-8")

          # Add setup and reconfigure controls.
          path = Path("intg-appletv/setup_flow.py")
          text = path.read_text(encoding="utf-8")
          text = replace_once(
              text,
              "from i18n import __, _a, _af, _am\n",
              "from i18n import __, _a, _af, _am\nfrom media_styling import (\n    DEFAULT_MEDIA_ARTIST_STYLE,\n    DEFAULT_MEDIA_TITLE_STYLE,\n    normalize_media_style_template,\n)\n",
              "setup import",
          )
          anchor = "            global_volume = selected_device.global_volume if selected_device.global_volume is not None else True\n"
          text = replace_once(
              text,
              anchor,
              anchor
              + "            media_styling = selected_device.media_styling\n"
              + "            media_title_style = normalize_media_style_template(\n"
              + "                selected_device.media_title_style, DEFAULT_MEDIA_TITLE_STYLE\n"
              + "            )\n"
              + "            media_artist_style = normalize_media_style_template(\n"
              + "                selected_device.media_artist_style, DEFAULT_MEDIA_ARTIST_STYLE\n"
              + "            )\n",
              "reconfigure defaults",
          )
          anchor = "                    __global_volume(enabled=global_volume),\n"
          text = replace_once(
              text,
              anchor,
              anchor
              + "                    *__media_styling(\n"
              + "                        enabled=media_styling,\n"
              + "                        title_style=media_title_style,\n"
              + "                        artist_style=media_artist_style,\n"
              + "                    ),\n",
              "reconfigure fields",
          )
          anchor = "            __global_volume(enabled=True),\n"
          text = replace_once(
              text,
              anchor,
              anchor
              + "            *__media_styling(\n"
              + "                enabled=False,\n"
              + "                title_style=DEFAULT_MEDIA_TITLE_STYLE,\n"
              + "                artist_style=DEFAULT_MEDIA_ARTIST_STYLE,\n"
              + "            ),\n",
              "initial setup fields",
          )
          old = '    choice = msg.input_values["choice"]\n    global_volume = msg.input_values.get("global_volume", "true") == "true"\n'
          new = (
              '    choice = msg.input_values["choice"]\n'
              '    global_volume = _checkbox_enabled(msg.input_values.get("global_volume"), default=True)\n'
              '    media_styling = _checkbox_enabled(msg.input_values.get("media_styling"), default=False)\n'
              '    media_title_style = normalize_media_style_template(\n'
              '        msg.input_values.get("media_title_style"), DEFAULT_MEDIA_TITLE_STYLE\n'
              '    )\n'
              '    media_artist_style = normalize_media_style_template(\n'
              '        msg.input_values.get("media_artist_style"), DEFAULT_MEDIA_ARTIST_STYLE\n'
              '    )\n'
          )
          text = replace_once(text, old, new, "device choice values")
          anchor = "            global_volume=global_volume,\n"
          text = replace_once(
              text,
              anchor,
              anchor
              + "            media_styling=media_styling,\n"
              + "            media_title_style=media_title_style,\n"
              + "            media_artist_style=media_artist_style,\n",
              "device config setup",
          )
          anchor = "        global_volume=_pairing_apple_tv.device_config.global_volume,\n"
          text = replace_once(
              text,
              anchor,
              anchor
              + "        media_styling=_pairing_apple_tv.device_config.media_styling,\n"
              + "        media_title_style=_pairing_apple_tv.device_config.media_title_style,\n"
              + "        media_artist_style=_pairing_apple_tv.device_config.media_artist_style,\n",
              "pairing preservation",
          )
          anchor = '    global_volume = msg.input_values.get("global_volume", "true") == "true"\n'
          text = replace_once(
              text,
              anchor,
              '    global_volume = _checkbox_enabled(msg.input_values.get("global_volume"), default=True)\n'
              + '    media_styling = _checkbox_enabled(msg.input_values.get("media_styling"), default=False)\n'
              + '    media_title_style = normalize_media_style_template(\n'
              + '        msg.input_values.get("media_title_style"), DEFAULT_MEDIA_TITLE_STYLE\n'
              + '    )\n'
              + '    media_artist_style = normalize_media_style_template(\n'
              + '        msg.input_values.get("media_artist_style"), DEFAULT_MEDIA_ARTIST_STYLE\n'
              + '    )\n',
              "reconfigure values",
          )
          anchor = "    _reconfigured_device.global_volume = global_volume\n"
          text = replace_once(
              text,
              anchor,
              anchor
              + "    _reconfigured_device.media_styling = media_styling\n"
              + "    _reconfigured_device.media_title_style = media_title_style\n"
              + "    _reconfigured_device.media_artist_style = media_artist_style\n",
              "reconfigure persistence",
          )
          anchor = "def __global_volume(*, enabled: bool) -> dict[str, Any]:\n"
          helper = '''def _checkbox_enabled(value: Any, *, default: bool) -> bool:
              """Convert setup checkbox values from bool or string representation."""
              if value is None:
                  return default
              if isinstance(value, bool):
                  return value
              return str(value).casefold() == "true"


          def __media_styling(*, enabled: bool, title_style: str, artist_style: str) -> list[dict[str, Any]]:
              """Build optional Remote UI rich-text metadata styling setup fields."""
              return [
                  {
                      "id": "media_styling",
                      "label": _a("Style media title and artist"),
                      "field": {"checkbox": {"value": enabled}},
                  },
                  {
                      "id": "media_styling_info",
                      "label": _a("Media text styling"),
                      "field": {
                          "label": {
                              "value": _a(
                                  "Use {text} for the title or artist. Supported rich-text tags include "
                                  "b, i, u, strong, and font color with a quoted #RRGGBB value."
                              )
                          }
                      },
                  },
                  {
                      "id": "media_title_style",
                      "label": _a("Media title style"),
                      "field": {"text": {"value": title_style}},
                  },
                  {
                      "id": "media_artist_style",
                      "label": _a("Media artist style"),
                      "field": {"text": {"value": artist_style}},
                  },
              ]


          '''
          text = replace_once(text, anchor, helper + anchor, "setup helpers")
          path.write_text(text, encoding="utf-8")

          # Apply styling only to title/artist output, while retaining raw metadata internally.
          path = Path("intg-appletv/tv.py")
          text = path.read_text(encoding="utf-8")
          text = replace_once(
              text,
              "from config import AtvDevice, AtvProtocol\n",
              "from config import AtvDevice, AtvProtocol\nfrom media_styling import (\n    DEFAULT_MEDIA_ARTIST_STYLE,\n    DEFAULT_MEDIA_TITLE_STYLE,\n    apply_media_text_style,\n)\n",
              "tv import",
          )
          anchor = "    @property\n    def attributes(self) -> dict[str, Any]:\n"
          props = '''    @property
          def media_title(self) -> str:
              """Return the media title formatted for Remote UI when styling is enabled."""
              return apply_media_text_style(
                  self._media_title,
                  enabled=self._device.media_styling,
                  template=self._device.media_title_style,
                  fallback_template=DEFAULT_MEDIA_TITLE_STYLE,
              )

              @property
          def media_artist(self) -> str:
              """Return the media artist formatted for Remote UI when styling is enabled."""
              return apply_media_text_style(
                  self._media_artist,
                  enabled=self._device.media_styling,
                  template=self._device.media_artist_style,
                  fallback_template=DEFAULT_MEDIA_ARTIST_STYLE,
              )

          '''
          # Dedent the literal by the indentation introduced by the workflow script.
          import textwrap
          props = textwrap.dedent(props)
          text = replace_once(text, anchor, props + anchor, "tv properties")
          text = replace_once(
              text,
              '            MediaAttr.MEDIA_TITLE: self._media_title or "",\n',
              '            MediaAttr.MEDIA_TITLE: self.media_title,\n',
              "title attribute",
          )
          text = replace_once(
              text,
              '            MediaAttr.MEDIA_ARTIST: self._media_artist or "",\n',
              '            MediaAttr.MEDIA_ARTIST: self.media_artist,\n',
              "artist attribute",
          )
          old = "        if not device.credentials:\n            device.credentials = []\n        self._device = device\n        self._apple_tv_conf = None\n"
          new = (
              "        if not device.credentials:\n"
              "            device.credentials = []\n"
              "        previous_title = self.media_title\n"
              "        previous_artist = self.media_artist\n"
              "        self._device = device\n"
              "        self._apple_tv_conf = None\n"
              "        metadata_update: dict[MediaAttr, Any] = {}\n"
              "        if self.media_title != previous_title:\n"
              "            metadata_update[MediaAttr.MEDIA_TITLE] = self.media_title\n"
              "        if self.media_artist != previous_artist:\n"
              "            metadata_update[MediaAttr.MEDIA_ARTIST] = self.media_artist\n"
              "        if metadata_update:\n"
              "            self.events.emit(EVENTS.UPDATE, self._device.identifier, metadata_update)\n"
          )
          text = replace_once(text, old, new, "update config refresh")
          text = replace_once(
              text,
              "            update[MediaAttr.MEDIA_TITLE] = raw_title\n",
              "            update[MediaAttr.MEDIA_TITLE] = self.media_title\n",
              "title update",
          )
          text = replace_once(
              text,
              "            update[MediaAttr.MEDIA_ARTIST] = raw_artist\n",
              "            update[MediaAttr.MEDIA_ARTIST] = self.media_artist\n",
              "artist update",
          )
          path.write_text(text, encoding="utf-8")

          Path("tests/unit/test_media_styling.py").write_text(
              '''"""Tests for optional Remote UI rich-text media metadata styling."""

          from media_styling import (
              DEFAULT_MEDIA_ARTIST_STYLE,
              DEFAULT_MEDIA_TITLE_STYLE,
              apply_media_text_style,
              normalize_media_style_template,
          )


          def test_styling_disabled_preserves_original_text() -> None:
              assert apply_media_text_style(
                  "AC/DC & Friends",
                  enabled=False,
                  template="<b>{text}</b>",
                  fallback_template=DEFAULT_MEDIA_TITLE_STYLE,
              ) == "AC/DC & Friends"


          def test_styling_applies_user_template() -> None:
              assert apply_media_text_style(
                  "Now Playing",
                  enabled=True,
                  template='<u><font color="#865cff">{text}</font></u>',
                  fallback_template=DEFAULT_MEDIA_TITLE_STYLE,
              ) == '<u><font color="#865cff">Now Playing</font></u>'


          def test_metadata_is_escaped_before_inserting_into_rich_text() -> None:
              assert apply_media_text_style(
                  "A & <img src=bad>",
                  enabled=True,
                  template="<b>{text}</b>",
                  fallback_template=DEFAULT_MEDIA_TITLE_STYLE,
              ) == "<b>A &amp; &lt;img src=bad&gt;</b>"


          def test_invalid_template_falls_back_to_default() -> None:
              assert normalize_media_style_template(
                  "<b>constant</b>", DEFAULT_MEDIA_TITLE_STYLE
              ) == DEFAULT_MEDIA_TITLE_STYLE
              assert apply_media_text_style(
                  "Song",
                  enabled=True,
                  template="<b>constant</b>",
                  fallback_template=DEFAULT_MEDIA_TITLE_STYLE,
              ) == "<b>Song</b>"


          def test_default_artist_style() -> None:
              assert apply_media_text_style(
                  "Artist",
                  enabled=True,
                  template=DEFAULT_MEDIA_ARTIST_STYLE,
                  fallback_template=DEFAULT_MEDIA_ARTIST_STYLE,
              ) == '<i><font color="#9ca3af">Artist</font></i>'
          ''',
              encoding="utf-8",
          )
          PY
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r test-requirements.txt
      - name: Format and validate
        run: |
          python -m ruff check intg-appletv tests --fix
          python -m ruff format intg-appletv tests
          python -m ruff check intg-appletv tests
          python -m ruff format --check intg-appletv tests
          python -m pyright
          python -m pytest
      - name: Commit feature
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add intg-appletv/config.py intg-appletv/setup_flow.py intg-appletv/tv.py intg-appletv/media_styling.py tests/unit/test_media_styling.py
          git commit -m 'Add optional media metadata styling'
          git push origin HEAD:feat/media-metadata-styling
