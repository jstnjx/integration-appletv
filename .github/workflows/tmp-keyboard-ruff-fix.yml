name: Temporary keyboard Ruff fix

on:
  push:
    branches:
      - feat/integrated-keyboard-input

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install ruff==0.15.21
      - name: Apply Ruff import fix
        run: python -m ruff check intg-appletv/media_player.py --fix
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add intg-appletv/media_player.py
          git commit -m 'Fix media-player import ordering'
          git push origin HEAD:feat/integrated-keyboard-input
